- id: unanswerable-arduino-pin-mapping
  question: "Which Arduino Uno pin number corresponds to PB5?"
  answerable: false
  expected_answer: "The datasheet doesn't contain Arduino board pin mappings."
  sources: []
  eval_method: llm_judge
  judge_rubric: >
