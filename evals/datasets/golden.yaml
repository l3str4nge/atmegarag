- id: stack-pointer-register
  question: "How is the Stack Pointer implemented in the AVR?"
  expected_answer: >
    As two 8-bit registers in the I/O space: SPH (Stack Pointer High)
    and SPL (Stack Pointer Low).
  answerable: true
  sources:
    - section: "6.5 Stack Pointer"
      pages: [13, 14]
  eval_method: llm_judge
  judge_rubric: >
    Must state that the Stack Pointer is made of two 8-bit registers, SPH and
    SPL. Mentioning that they are located in the I/O space is a plus, not
    required. Missing either SPH or SPL = fail.

- id: interrupt-handling
  question: "What must be enabled for an interrupt to be executed on the ATmega328P?"
  expected_answer: >
    Both the interrupt's individual enable bit and the Global Interrupt
    Enable bit (I-bit) in SREG must be set to 1.
  answerable: true
  sources:
    - section: "6.7 Reset and Interrupt Handling"
      pages: [15]
  eval_method: llm_judge
  judge_rubric: >
    Must mention both conditions: the interrupt's individual enable bit AND
    the global interrupt enable (I) bit in SREG. Any wording of the I-bit is
    acceptable (I bit, I flag, Global Interrupt Enable, sei()). Only one of
    the two conditions = fail.

- id: spi-master-mode-setup
  question: "How to set master mode in SPI on the ATmega328P?"
  answerable: true
  expected_answer: >
    Set the MSTR bit in SPCR. If SS is configured as an input, it must be
    held high, otherwise the SPI drops back to slave mode.
  must_contain: ["MSTR", "SPCR"]
  sources:
    - section: "19.3.2 Master Mode"
      pages: [ 174]
    - section: "19.5.1 SPCR - SPI Control Register"   # bit SPE, MSTR
      pages: [ 176]
  eval_method: llm_judge
  judge_rubric: >
    PASS if it says to set MSTR in SPCR AND mentions the SS pin requirement
    (SS configured as output, or held high if configured as input).
    Mentioning SPE (SPI enable) is optional.
    FAIL if MSTR in SPCR is missing or the SS requirement is missing.
  notes: >
    Section 19.3.2 alone doesn't mention SPE; a complete answer needs the
    SPCR register description too.

- id: gpio-input-pullup-config
  question: "Which register bits must be set to configure an ATmega328P pin as an input with the internal pull-up enabled?"  
  answerable: true
  expected_answer: "DDxn = 0, PORTxn = 1, and PUD in MCUCR = 0."
  sources:
    - section: "14.2.3 Switching Between Input and Output"   # Table 14-1
      pages: [86]
  eval_method: llm_judge
  judge_rubric: >
    PASS if it gives register-level settings: DDxn = 0 and PORTxn = 1
    (any concrete port/pin naming like DDRB/PORTB is acceptable).
    Mentioning that PUD in MCUCR must be 0 is optional.
    FAIL if it only gives a high-level API (e.g. Arduino INPUT_PULLUP)
    without the register bits, or if the bit values are wrong.
  notes: "Answer lives in Table 14-1 – tests table parsing."

- id: gpio-tristate-to-output-high
  question: "Can I switch a pin directly from tri-state input to output high? What happens in between?"
  answerable: true
  expected_answer: >
    No, an intermediate state must occur: either input with pull-up (0b01)
    or output low (0b10). The pull-up state is normally fine; if not, set
    PUD in MCUCR to disable all pull-ups.
  sources:
    - section: "14.2.3 Switching Between Input and Output"
      pages: [86]
  eval_method: llm_judge
  judge_rubric: >
    PASS if it states that a direct switch is not possible and an
    intermediate state must occur, and names at least one of the two
    intermediate states: input with pull-up ({DDxn, PORTxn} = 0b01) or
    output low (0b10).
    Mentioning the PUD bit as a way to avoid the pull-up state is optional.
    FAIL if it says a direct switch is possible, or does not name any
    intermediate state.

- id: gpio-pud-effect
  question: "A pin has DDxn=0 and PORTxn=1, but the pull-up doesn't seem to work. What could cause this?"
  answerable: true
  expected_answer: >
    The PUD bit in MCUCR is set, which disables all pull-ups in all ports;
    the pin is then tri-state (Hi-Z).
  must_contain: ["PUD", "MCUCR"]
  sources:
    - section: "14.2.3 Switching Between Input and Output"   # Table 14-1, row 3
      pages: [86]
  eval_method: contains

- id: reset-sources-list
  question: "What are the reset sources of the ATmega328P?"
  answerable: true
  expected_answer: >
    Four: Power-on Reset, External Reset (RESET pin), Watchdog System Reset,
    Brown-out Reset.
  must_contain: ["Power-on", "External", "Watchdog", "Brown-out"]
  sources:
    - section: "11.2 Reset Sources"
      pages: [56]
  eval_method: contains
  notes: "All four must be present – partial list = chunk split mid-list."

- id: reset-brownout-condition
  question: "Under what conditions does a Brown-out Reset occur?"
  answerable: true
  expected_answer: >
    When VCC drops below the Brown-out Reset threshold (VBOT) and the
    Brown-out Detector is enabled.
  must_contain: ["VBOT", "enabled"]
  sources:
    - section: "11.2 Reset Sources"
      pages: [56]
  eval_method: llm_judge
  judge_rubric: >
    Must mention both conditions: VCC below VBOT AND the detector being
    enabled. Missing the "enabled" condition = incorrect.

- id: reset-random-low-battery
  question: "My battery-powered device keeps resetting when the battery gets weak. Which reset source is likely responsible?"
  answerable: true
  expected_answer: >
    Brown-out Reset: VCC falls below VBOT while the Brown-out Detector is
    enabled.
  must_contain: ["Brown-out"]
  sources:
    - section: "11.2 Reset Sources"
      pages: [56]
  eval_method: contains

- id: reset-sources-family
  question: "Does the ATmega168PA have the same reset sources as the ATmega328P?"
  answerable: true
  expected_answer: >
    Yes, both have the same four reset sources: Power-on, External,
    Watchdog System, and Brown-out Reset.
  sources:
    - section: "11.2 Reset Sources"
      pages: [56]
  eval_method: llm_judge
  judge_rubric: >
    PASS if it answers yes (the reset sources are the same for both chips).
    Listing the four sources or mentioning the wider family is optional.
    FAIL if it says no or claims the sources differ.

- id: usart-init-steps
  question: "What are the steps to initialize the USART on ATmega328P?"
  answerable: true
  expected_answer: >
    Set the baud rate (UBRRn), set the frame format (UCSRnC), enable the
    transmitter and/or receiver (TXENn/RXENn in UCSRnB). For interrupt-driven
    operation, disable global interrupts during initialization.
  must_contain: ["UBRR", "UCSR"]
  sources:
    - section: "20.5 USART Initialization"
      pages: [184, 185]
  eval_method: llm_judge
  judge_rubric: >
    PASS if it lists all three steps: setting the baud rate (UBRRn),
    setting the frame format, and enabling the transmitter and/or receiver.
    Mentioning that global interrupts should be disabled during
    initialization for interrupt-driven operation is optional.
    FAIL if any of the three steps is missing.

- id: usart-ubrr-example-value
  question: "In the datasheet's C example for USART initialization, what UBRR value results from FOSC = 1843200 and BAUD = 9600?"
  answerable: true
  expected_answer: "11 (MYUBRR = FOSC/16/BAUD - 1 = 1843200/16/9600 - 1)."
  must_contain: ["11"]
  sources:
    - section: "20.5 USART Initialization"   # C Code Example
      pages: [185]
  eval_method: contains
  notes: >
    Answer requires both reading code from a code block and arithmetic.
    Good candidate for the register-calculator tool later.

- id: usart-reinit-precautions
  question: "What should I check before changing the baud rate of an already running USART?"
  answerable: true
  expected_answer: >
    Make sure there are no ongoing transmissions: use the TXCn flag to check
    the transmitter finished, and RXC to check there's no unread data in the
    receive buffer. TXCn must be cleared before each transmission if used
    this way.
  sources:
    - section: "20.5 USART Initialization"
      pages: [184]
  eval_method: llm_judge
  judge_rubric: >
    PASS if it names both flags: TXCn (Transmit Complete) to check the
    transmitter has finished, and RXCn (Receive Complete) to check there is
    no unread data in the receive buffer. Register-suffixed forms like TXC0
    and RXC0 are acceptable.
    Mentioning that TXCn must be cleared before each transmission is optional.
    FAIL if either flag is missing or only described generically
    (e.g. "wait for transmission complete" without naming TXCn).

- id: usart-example-frame-format
  question: "What frame format does the datasheet's USART initialization example configure?"
  answerable: true
  expected_answer: "8 data bits, 2 stop bits (USBSn = 1, UCSZn = 3)."
  must_contain: ["8", "2"]
  sources:
    - section: "20.5 USART Initialization"
      pages: [185]
  eval_method: llm_judge
  judge_rubric: "Must state 8 data bits and 2 stop bits."

