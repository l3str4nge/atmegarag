- id: lockbits-count-48pa-vs-328p
  question: "How many lock bits does the ATmega48PA have compared to the ATmega328P?"
  answerable: true
  expected_answer: >
    ATmega48PA has two lock bits (LB1, LB2); ATmega328P has six (LB1, LB2
    plus Boot Lock bits BLB01, BLB02, BLB11, BLB12).
  must_contain: ["two", "six"]
  sources:
    - section: "28.1 Program And Data Memory Lock Bits"   # text + Table 28-1 note 2
      pages: [289]
  eval_method: llm_judge
  judge_rubric: >
    Must give 2 for ATmega48PA and 6 for ATmega328P. Full credit if it
    explains the difference is the Boot Lock bits (BLBxx).
  notes: >
    The BLBxx restriction is in a table footnote ("Only on ATmega88A/.../328P")
    – tests whether footnotes survive parsing.

- id: lockbits-locked-out-recovery
  question: "I programmed both LB1 and LB2 and now I can't verify the flash or change the fuses. What happened and how do I undo it?"
  answerable: true
  expected_answer: >
    LB1=0 and LB2=0 is protection mode 3: programming and verification of
    Flash and EEPROM are disabled and Fuse and Boot Lock bits are locked.
    Lock bits can only be erased back to "1" with the Chip Erase command.
  must_contain: ["Chip Erase"]
  sources:
    - section: "28.1 Program And Data Memory Lock Bits"   #