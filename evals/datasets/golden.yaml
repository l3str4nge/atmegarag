- id: unanswerable-false-premise-usb
  question: "How do I configure the USB controller on the ATmega328P?"
  answerable: false
  expected_answer: >
    The documentation describes no USB controller for the ATmega328P.
  sources: []
  eval_method: llm_judge
  judge_rubric: >
    Correct if the system says there's no USB peripheral described in the
