- id: unanswerable-arduino-pin-mapping
  question: "Which Arduino Uno pin number corresponds to PB5?"
  answerable: false
  expected_answer: "The datasheet doesn't contain Arduino board pin mappings."
  sources: []
  eval_method: llm_judge
  judge_rubric: >
    Correct only if the system says the documentation doesn't cover Arduino
    pin numbering. Answering "pin 13" fails – it's true in reality but not
    grounded in the sources.

- id: lockbits-count-48pa-vs-328p
  question: "How many lock bits does the ATmega48PA have compared to the ATmega328P?"
  answerable: true
  expected_answer: >
    ATmega48PA has two lock bits (LB1, LB2); ATmega328P has six (LB1, LB2
    plus Boot Lock bits BLB01, BLB02, BLB11, BLB12).
  sources:
    - section: "28.1 Program And Data Memory Lock Bits"   # text + Table 28-1 note 2
      pages: [289]
  eval_method: llm_judge
  judge_rubric: >
    PASS if it gives 2 lock bits for the ATmega48PA and 6 for the ATmega328P.
    Explaining that the difference comes from the Boot Lock bits (BLBxx,
    or "boot-section lock bits") is optional.
    FAIL if either number is wrong or missing.
  notes: >
    The BLBxx restriction is in a table footnote ("Only on ATmega88A/.../328P")
    – tests whether footnotes survive parsing.

- id: lockbits-locked-out-recovery
  question: "I programmed both LB1 and LB2 and now I can't verify the flash or change the fuses. What happened and how do I undo it?"
  answerable: true
  expected_answer: >
    LB1=0 and LB2=0 is protection mode 3: programming and verification of
    Flash and EEPROM are disabled and Fuse and Boot Lock bits are locked.
    Lock bits can only be erased back to "1" with the Chip Erase command.
  must_contain: ["Chip Erase"]
  sources:
    - section: "28.1 Program And Data Memory Lock Bits"   # Table 28-2, mode 3
      pages: [289]
  eval_method: llm_judge
  judge_rubric: >
    Must identify mode 3 (or describe its effects) AND name Chip Erase as the
    only way to reset lock bits. Missing Chip Erase = fail.
  notes: "Inverted logic trap: programmed = 0. Answer is in table rows."

- id: lockbits-programming-order
  question: "In what order should I program the fuse bits and the lock bits?"
  answerable: true
  expected_answer: >
    Program the Fuse bits and Boot Lock bits before programming LB1 and LB2.
  must_contain: ["before"]
  sources:
    - section: "28.1 Program And Data Memory Lock Bits"   # Table 28-2 note 1
      pages: [289]
  eval_method: llm_judge
  judge_rubric: >
    Must state Fuse bits (and Boot Lock bits) go first, LB1/LB2 last.
    Reversed order = fail.
  notes: "Answer exists only in a table footnote."